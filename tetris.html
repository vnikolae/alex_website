<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Tetris</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="game-page">
  <div class="game-container">
    <a class="back-link" href="index.html">← Back to Arcade</a>
    <h1 class="game-title">Alex Tetris</h1>
    <p class="game-instructions">
      <b>← →</b> Move &nbsp;·&nbsp; <b>↑</b> Rotate &nbsp;·&nbsp; <b>↓</b> Soft drop &nbsp;·&nbsp;
      <b>Space</b> Hard drop &nbsp;·&nbsp; <b>C / Shift</b> Hold
    </p>
    <div class="scoreboard">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <canvas id="tetris" width="450" height="600"></canvas>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
