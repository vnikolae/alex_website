<!DOCTYPE html>
<html lang="en">
<head>

  <title>Alex Snake</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="game-page">

    <a class="back-link" href="index.html">← Back to Arcade</a>

    <canvas id="snake" width="600" height="600"></canvas>
  </div>
  <script src="snake.js"></script>
